<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Login - EMsys</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container">
        <header>
            <h1>EMsys - Employee Portal</h1>
            <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
        </header>

        <!-- Flash Messages -->
        {% if get_flashed_messages() %}
            <div class="flash-messages">
                {% for message in get_flashed_messages(with_categories=True) %}
                    <div class="flash {{ message[0] }}">
                        {{ message[1] }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <main>
            <div class="login-box">
                <h2>Employee Verification</h2>
                <p>Enter your Employee ID to access your team dashboard</p>
                
                <form method="POST" action="{{ url_for('user_verify') }}">
                    <div class="form-group">
                        <label for="employee_id">Employee ID:</label>
                        <input 
                            type="text" 
                            id="employee_id" 
                            name="employee_id" 
                            required
                            placeholder="e.g., EMP001">
                    </div>

                    <button type="submit" class="btn btn-user">Verify & Login</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
